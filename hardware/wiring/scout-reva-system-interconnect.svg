<svg viewBox="0 0 1800 1260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#d4820a"/></marker>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#222"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f8a4c"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2565c7"/></marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1260" fill="#ffffff"/>

  <!-- Title -->
  <text x="900" y="42" font-size="30" font-weight="700" fill="#1a1a1a" text-anchor="middle">SCOUT Buoy — Prototype System Interconnect</text>
  <text x="900" y="68" font-size="15" fill="#555555" text-anchor="middle">Rev A  |  Solar-powered sensing + logging + LoRa</text>
  <line x1="40" y1="88" x2="1760" y2="88" stroke="#cccccc" stroke-width="1.5"/>

  <!-- Legend -->
  <rect x="1530" y="102" width="235" height="168" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="6"/>
  <text x="1542" y="120" font-size="12" font-weight="700" fill="#333333">LEGEND</text>
  <rect x="1542" y="131" width="14" height="10" fill="#c0392b"/><text x="1562" y="140" font-size="10.5" fill="#333">SYSTEM_5V / SOLAR_5V / BAT+</text>
  <rect x="1542" y="151" width="14" height="10" fill="#d4820a"/><text x="1562" y="160" font-size="10.5" fill="#333">3V3 (logic power)</text>
  <rect x="1542" y="171" width="14" height="10" fill="#222222"/><text x="1562" y="180" font-size="10.5" fill="#333">GND (common return)</text>
  <rect x="1542" y="191" width="14" height="10" fill="#2565c7"/><text x="1562" y="200" font-size="10.5" fill="#333">Digital bus (I2C / SPI)</text>
  <rect x="1542" y="211" width="14" height="10" fill="#1f8a4c"/><text x="1562" y="220" font-size="10.5" fill="#333">Sensor signal (analog/1-Wire)</text>
  <text x="1542" y="240" font-size="9" fill="#888">Labeled by net name,</text>
  <text x="1542" y="252" font-size="9" fill="#888">not physical wire color</text>

  <!-- Group boxes -->
  <rect x="40" y="150" width="520" height="540" fill="none" stroke="#888888" stroke-width="1.3" stroke-dasharray="7 4" rx="10"/>
  <text x="55" y="175" font-size="15" font-weight="700" fill="#333333">POWER SUBSYSTEM</text>

  <rect x="620" y="150" width="520" height="540" fill="none" stroke="#888888" stroke-width="1.3" stroke-dasharray="7 4" rx="10"/>
  <text x="635" y="175" font-size="15" font-weight="700" fill="#333333">MAIN CONTROLLER + LOGGER (STACKED)</text>

  <rect x="1180" y="150" width="560" height="540" fill="none" stroke="#888888" stroke-width="1.3" stroke-dasharray="7 4" rx="10"/>
  <text x="1195" y="175" font-size="15" font-weight="700" fill="#333333">SENSOR SUBSYSTEM</text>

  <!-- ===== POWER GROUP ===== -->
  <!-- Solar panel -->
  <rect x="80" y="205" width="220" height="100" fill="#fff6e8" stroke="#333333" stroke-width="1.5" rx="8"/>
  <text x="190" y="240" font-size="13.5" font-weight="700" text-anchor="middle">FlexSolar 10W Panel</text>
  <text x="190" y="258" font-size="11" text-anchor="middle">5V USB regulated output</text>
  <text x="190" y="274" font-size="9.5" fill="#666" text-anchor="middle">portable foldable solar panel</text>

  <!-- Charger -->
  <rect x="80" y="390" width="240" height="150" fill="#eef4ff" stroke="#333333" stroke-width="1.5" rx="8"/>
  <text x="200" y="425" font-size="13.5" font-weight="700" text-anchor="middle">Adafruit bq25185</text>
  <text x="200" y="443" font-size="11" text-anchor="middle">USB/DC/Solar Charger + 5V Boost</text>
  <text x="200" y="459" font-size="10" fill="#666" text-anchor="middle">PID 6106</text>
  <text x="200" y="475" font-size="9" fill="#888" font-style="italic" text-anchor="middle">note: 6 hr uninterrupted-charge safety timeout</text>
  <text x="200" y="515" font-size="9.5" fill="#555" text-anchor="middle">(J5 solar in · J6 battery · boosted 5V out)</text>

  <!-- Battery -->
  <rect x="380" y="410" width="160" height="110" fill="#fff0f0" stroke="#333333" stroke-width="1.5" rx="8"/>
  <text x="460" y="445" font-size="13.5" font-weight="700" text-anchor="middle">PKCELL LiPo</text>
  <text x="460" y="463" font-size="11" text-anchor="middle">3.7V nominal</text>
  <text x="460" y="479" font-size="11" text-anchor="middle">500 mAh</text>

  <!-- Solar -> Charger wires -->
  <line x1="150" y1="305" x2="150" y2="388" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrowRed)"/>
  <text x="158" y="352" font-size="11" fill="#c0392b" font-family="Consolas, monospace">SOLAR_5V</text>
  <line x1="230" y1="305" x2="230" y2="388" stroke="#222" stroke-width="2.2" marker-end="url(#arrowBlack)"/>
  <text x="238" y="352" font-size="11" fill="#222" font-family="Consolas, monospace">GND</text>

  <!-- Battery <-> Charger wires -->
  <line x1="380" y1="440" x2="322" y2="440" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrowRed)" marker-start="url(#arrowRed)"/>
  <text x="332" y="433" font-size="10.5" fill="#c0392b" font-family="Consolas, monospace">BAT+</text>
  <line x1="380" y1="485" x2="322" y2="485" stroke="#222" stroke-width="2.2" marker-end="url(#arrowBlack)" marker-start="url(#arrowBlack)"/>
  <text x="332" y="478" font-size="10.5" fill="#222" font-family="Consolas, monospace">GND</text>

  <!-- ===== CONTROLLER GROUP ===== -->
  <!-- Adalogger (stacked on top) -->
  <rect x="660" y="205" width="440" height="115" fill="#eefaf0" stroke="#333333" stroke-width="1.5" rx="8"/>
  <text x="880" y="238" font-size="13.5" font-weight="700" text-anchor="middle">Adafruit Adalogger FeatherWing</text>
  <text x="880" y="256" font-size="11" text-anchor="middle">RTC + microSD  ·  PID 2922</text>
  <text x="880" y="272" font-size="9.5" fill="#666" text-anchor="middle">stacks directly onto Feather header pins</text>
  <text x="880" y="298" font-size="10" fill="#2565c7" text-anchor="middle" font-family="Consolas, monospace">3V3 · GND · SDA · SCL · SCK · MOSI · MISO · D10</text>

  <!-- stack connector bar -->
  <rect x="700" y="320" width="360" height="20" fill="#2565c7" rx="3"/>
  <text x="880" y="334" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">DIRECT STACKING HEADER — FULL DIGITAL BUS</text>

  <!-- Feather M0 -->
  <rect x="660" y="345" width="440" height="150" fill="#f5f0ff" stroke="#333333" stroke-width="1.5" rx="8"/>
  <text x="880" y="378" font-size="13.5" font-weight="700" text-anchor="middle">Adafruit Feather M0 + RFM95 LoRa</text>
  <text x="880" y="396" font-size="11" text-anchor="middle">Product 3178  ·  3.3V logic</text>
  <text x="880" y="412" font-size="9.5" fill="#666" text-anchor="middle">LoRa radio integrated on-board (RFM95)</text>
  <text x="880" y="426" font-size="9" fill="#888" font-style="italic" text-anchor="middle">not a separate module</text>

  <!-- Charger -> Feather power (routed above the battery box, clear of its label text) -->
  <path d="M320,383 L660,368" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrowRed)"/>
  <text x="420" y="360" font-size="11" fill="#c0392b" font-family="Consolas, monospace">SYSTEM_5V → VBUS</text>
  <path d="M320,401 L660,388" fill="none" stroke="#222" stroke-width="2.2" marker-end="url(#arrowBlack)"/>
  <text x="420" y="410" font-size="11" fill="#222" font-family="Consolas, monospace">GND</text>

  <!-- ===== SENSOR GROUP ===== -->
  <!-- DS18B20 -->
  <rect x="1300" y="205" width="260" height="110" fill="#fff8e6" stroke="#333333" stroke-width="1.5" rx="8"/>
  <text x="1430" y="238" font-size="13.5" font-weight="700" text-anchor="middle">Adafruit DS18B20</text>
  <text x="1430" y="256" font-size="11" text-anchor="middle">Waterproof Temp Probe</text>
  <text x="1430" y="272" font-size="10" fill="#666" text-anchor="middle">PID 3846</text>
  <text x="1430" y="288" font-size="9.5" fill="#888" text-anchor="middle">1-Wire digital sensor</text>

  <!-- SEN0189 -->
  <rect x="1300" y="400" width="260" height="130" fill="#eefaf5" stroke="#333333" stroke-width="1.5" rx="8"/>
  <text x="1430" y="432" font-size="13.5" font-weight="700" text-anchor="middle">DFRobot SEN0189</text>
  <text x="1430" y="450" font-size="11" text-anchor="middle">Turbidity Sensor / Interface</text>
  <text x="1430" y="466" font-size="9.5" fill="#666" text-anchor="middle">0–4.5V analog output</text>
  <text x="1430" y="481" font-size="9.5" fill="#666" text-anchor="middle">5V supply required</text>

  <!-- Feather 3V3 -> DS18B20 (with R1 pull-up) -->
  <path d="M1100,370 L1230,370 L1230,232 L1300,232" fill="none" stroke="#d4820a" stroke-width="2.2" marker-end="url(#arrowOrange)"/>
  <text x="1108" y="363" font-size="10.5" fill="#d4820a" font-family="Consolas, monospace">3V3</text>

  <path d="M1100,400 L1270,400 L1270,265 L1300,265" fill="none" stroke="#1f8a4c" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="1108" y="393" font-size="10.5" fill="#1f8a4c" font-family="Consolas, monospace">TEMP_DATA → D5</text>

  <!-- R1 pull-up bridging 3V3 (x1230) and D5 (x1270) vertical runs -->
  <polyline points="1230,300 1240,292 1250,308 1260,292 1270,300" fill="none" stroke="#333" stroke-width="1.8"/>
  <text x="1250" y="285" font-size="9.5" fill="#333" text-anchor="middle" font-weight="700">R1</text>
  <text x="1250" y="318" font-size="9.5" fill="#333" text-anchor="middle">4.7kΩ pull-up</text>

  <!-- Feather GND -> DS18B20 GND -->
  <path d="M1100,470 L1288,470 L1288,296 L1300,296" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrowBlack)"/>
  <text x="1108" y="463" font-size="10.5" fill="#222" font-family="Consolas, monospace">GND</text>

  <!-- Charger -> SEN0189 power (routed below to avoid crossing Feather box) -->
  <path d="M320,505 L320,565 L1280,565 L1280,432 L1300,432" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrowRed)"/>
  <text x="760" y="558" font-size="11" fill="#c0392b" font-family="Consolas, monospace">SYSTEM_5V</text>
  <path d="M320,530 L340,530 L340,600 L1255,600 L1255,462 L1300,462" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrowBlack)"/>
  <text x="760" y="593" font-size="11" fill="#222" font-family="Consolas, monospace">GND</text>

  <!-- SEN0189 TURB_RAW -> R2/R3 divider -> TURB_DATA -> Feather A1 -->
  <line x1="1300" y1="405" x2="1195" y2="405" stroke="#1f8a4c" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="1198" y="397" font-size="10.5" fill="#1f8a4c" font-family="Consolas, monospace">TURB_RAW</text>

  <polyline points="1195,405 1185,414 1205,423 1185,432 1195,441" fill="none" stroke="#333" stroke-width="1.8"/>
  <text x="1150" y="425" font-size="9.5" fill="#333" text-anchor="end" font-weight="700">R2 10kΩ</text>

  <circle cx="1195" cy="441" r="3" fill="#1f8a4c"/>
  <line x1="1195" y1="441" x2="1100" y2="458" stroke="#1f8a4c" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="1000" y="452" font-size="10.5" fill="#1f8a4c" font-family="Consolas, monospace">TURB_DATA → A1</text>

  <polyline points="1195,441 1185,450 1205,459 1185,468 1195,477" fill="none" stroke="#333" stroke-width="1.8"/>
  <text x="1150" y="475" font-size="9.5" fill="#333" text-anchor="end" font-weight="700">R3 20kΩ</text>

  <line x1="1195" y1="477" x2="1195" y2="500" stroke="#222" stroke-width="2"/>
  <line x1="1178" y1="500" x2="1212" y2="500" stroke="#222" stroke-width="2"/>
  <line x1="1184" y1="506" x2="1206" y2="506" stroke="#222" stroke-width="1.6"/>
  <line x1="1190" y1="512" x2="1200" y2="512" stroke="#222" stroke-width="1.2"/>
  <text x="1195" y="530" font-size="9.5" fill="#222" text-anchor="middle" font-family="Consolas, monospace">GND</text>

  <!-- ===== DESIGN NOTES ===== -->
  <rect x="40" y="740" width="1720" height="230" fill="#fafafa" stroke="#cccccc" stroke-width="1.2" rx="8"/>
  <text x="60" y="768" font-size="14" font-weight="700" fill="#222">DESIGN NOTES</text>
  <text x="60" y="794" font-size="11.5" fill="#333">– Diagram derived strictly from SCOUT_RevA.kicad_sch (electrical source of truth). Product photos used only to identify physical hardware, never to infer connections.</text>
  <text x="60" y="816" font-size="11.5" fill="#333">– LoRa radio (RFM95) is integrated on the Feather M0 board — not represented as a separate module.</text>
  <text x="60" y="838" font-size="11.5" fill="#333">– Adalogger FeatherWing stacks directly onto the Feather's header pins; the digital bus (3V3, GND, SDA, SCL, SCK, MOSI, MISO, D10) is carried through that stack, not by flying leads.</text>
  <text x="60" y="860" font-size="11.5" fill="#333">– R1 (4.7kΩ) is a required pull-up between 3V3 and TEMP_DATA/D5 for 1-Wire DS18B20 communication.</text>
  <text x="60" y="882" font-size="11.5" fill="#333">– R2/R3 (10kΩ/20kΩ) form a voltage divider that scales SEN0189's 0–4.5V analog output down to ~0–3.0V for the Feather's 3.3V ADC input (A1).</text>
  <text x="60" y="904" font-size="11.5" fill="#333">– BAT+ connects only to the bq25185 charger's battery terminal — confirmed NOT wired directly to the Feather's onboard BAT pin (avoids a dual battery-charge path).</text>
  <text x="60" y="926" font-size="11.5" fill="#333">– Physical wire colors and connector styles (JST, screw terminal, etc.) are not specified in the schematic; all wiring here is labeled by net name only — verify against your actual hardware before final assembly.</text>
  <text x="60" y="948" font-size="10.5" fill="#888" font-style="italic">Source: SCOUT_RevA.kicad_sch  ·  Reference images: Adafruit Learning System, DFRobot Wiki, Maxim datasheet, Amazon listing</text>

  <text x="1760" y="1245" font-size="10" fill="#999" text-anchor="end">SCOUT Buoy Rev A — Prototype Interconnect Diagram</text>
</svg>
