<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buoy design explorer · S.C.O.U.T.</title>
<style>
/* Light only, like the rest of scoutscu.com: the stability frame inside has no dark theme, so a dark shell would clash. */
@font-face{font-family:'DM Sans';font-style:normal;font-weight:100 1000;font-display:swap;src:url('../fonts/dmsans-latin.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;font-display:swap;src:url('../fonts/jetbrainsmono-latin.woff2') format('woff2')}
:root{color-scheme:light only;--canvas:#f8f3ef;--sunken:#ede7e1;--surface:#fdf9f7;--text:#2b2520;--muted:#534c45;--subtle:#6f6760;
  --line:rgb(43 37 32 / .10);--line-strong:#867f78;--accent:#1f6763;--accent-hover:#16524f;--tint:#d6eeeb;--on-accent:#fffcfa;--focus:#1f6763;
  --ease:cubic-bezier(.22,1,.36,1);
  --font-sans:'DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:0;background:var(--canvas);color:var(--text);font-family:var(--font-sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
body.solo{padding:clamp(1rem,.6rem + 2vw,2rem)}
.micro{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.75rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--subtle);margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
.pick-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.25rem 1rem;margin:0 0 .9rem}
.pick-head .count{color:var(--accent)}
.pick-head .hint{margin:0;font-size:.8rem;color:var(--subtle)}
/* The design picker: a timeline of chips, oldest to newest. One control instead of slider + buttons + dropdown. */
.strip{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding:6px 0 .5rem;
  mask-image:linear-gradient(90deg,transparent,#000 1.5rem,#000 calc(100% - 1.5rem),transparent)}
.chip{flex:0 0 auto;width:9.25rem;scroll-snap-align:center;display:grid;gap:.1rem;text-align:left;font:inherit;color:var(--muted);cursor:pointer;
  background:none;border:0;border-top:2px solid var(--line-strong);padding:.65rem .75rem .35rem 0;position:relative;transition:color 180ms,border-color 180ms}
.chip:first-child{margin-left:1.5rem}.chip:last-child{margin-right:1.5rem}
.chip::before{content:"";position:absolute;left:0;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--canvas);border:2px solid var(--line-strong);transition:background 180ms,border-color 180ms}
.chip .i{font-family:var(--font-mono);font-size:.7rem;color:var(--subtle)}
.chip .t{font-size:.9rem;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .d{font-family:var(--font-mono);font-size:.7rem;color:var(--subtle)}
.chip:hover{color:var(--text)}
.chip[aria-checked=true]{color:var(--text);border-top-color:var(--accent)}
.chip[aria-checked=true]::before{background:var(--accent);border-color:var(--accent)}
.chip[aria-checked=true] .t{color:var(--accent)}
.now{margin:.6rem 0 0}
.now h2{font-size:clamp(1.2rem,1.05rem + .6vw,1.5rem);font-weight:500;letter-spacing:-.015em;line-height:1.25;margin:0}
.now .when{margin:.1rem 0 0;font-size:.875rem;color:var(--muted)}
/* Two panes on one surface, split by a hairline. The stability side is wider: its chart needs the room. */
.panes{display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem;margin:1.25rem 0 0;padding:1.25rem 0 0;border-top:1px solid var(--line);align-items:start}
@media (min-width:1000px){.panes{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0}
  .pane:first-child{padding-right:1.5rem}.pane+.pane{border-left:1px solid var(--line);padding-left:1.5rem}}
.pane h3{font-size:1.05rem;font-weight:500;letter-spacing:-.01em;margin:0 0 .75rem}
iframe{display:block;width:100%;border:0;background:transparent}
#vf{height:760px}#sf{height:980px}
@media (prefers-reduced-motion:reduce){.chip,.chip::before{transition:none}}
</style>
</head>
<body>
<div class="pick">
  <div class="pick-head">
    <p class="micro">Design <span class="count" id="cnt"></span></p>
    <p class="hint">The 3D model and the stability results follow your pick. Arrow keys work too.</p>
  </div>
  <div class="strip" id="strip" role="radiogroup" aria-label="Design, oldest to newest"></div>
  <div class="now" aria-live="polite"><h2 id="nm"></h2><p class="when" id="wh"></p></div>
</div>
<div class="panes">
  <section class="pane" aria-labelledby="h1">
    <h3 id="h1">See the shape</h3>
    <iframe id="vf" src="../viewer/index.html?embed=1" title="3D model of the selected buoy design" loading="lazy"></iframe>
  </section>
  <section class="pane" aria-labelledby="h2">
    <h3 id="h2">Will it stay upright?</h3>
    <iframe id="sf" src="../stability/index.html?embed=1" title="Stability results for the selected buoy design" loading="lazy"></iframe>
  </section>
</div>
<script>
const DESIGNS=[{"id":"v1","name":"v1 — earliest concept","when":"concept #1, undated (before 2026-08-17)","short":"v1","date":"concept"},{"id":"v2","name":"v2","when":"concept #2, undated","short":"v2","date":"concept"},{"id":"v3","name":"v3 — first snap-fit concept","when":"concept #3, undated","short":"v3","date":"concept"},{"id":"v4-concept","name":"v4 — hollow snap concept","when":"concept #4, undated","short":"v4","date":"concept"},{"id":"v5-pegs-seated","name":"v5 — sections stacked with pegs seated","when":"2026-11-06","short":"v5","date":"2026-11-06"},{"id":"v6-pegs-seated","name":"v6 — new top section, pegs seated","when":"2026-11-06","short":"v6","date":"2026-11-06"},{"id":"v8-concept","name":"v8 — octagon (bottom, DFM)","when":"concept #8, undated","short":"v8","date":"concept"},{"id":"v10-concept","name":"v10 — snap assembly, three chassis connectors","when":"concept #10, undated","short":"v10 snap assembly, three chassis connectors","date":"concept"},{"id":"v10-bottom","name":"v10 — bottom ring variant","when":"concept #10, undated","short":"v10 bottom ring variant","date":"concept"},{"id":"wedge-snap-v3","name":"Wedge, snap/keyhole (Master V3)","when":"tried and dropped 2026-08-17","short":"Wedge, snap/keyhole","date":"2026-08-17"},{"id":"wedge-bolted-v3","name":"Wedge, bolted (Master V3 Copy 1)","when":"chosen 2026-08-17","short":"Wedge, bolted","date":"2026-08-17"},{"id":"wedge-bolted-v4","name":"Bolted wedge v4 (chassis, wedge, caps)","when":"2026-08-22","short":"Bolted wedge v4","date":"2026-08-22"},{"id":"assembly-v5","name":"Full buoy assembly v5 (3.0 in caps)","when":"2026-09-25","short":"Assembly v5","date":"2026-09-25"},{"id":"assembly-v6","name":"Full buoy assembly v6 (1.5 in caps, ballast pipe)","when":"2026-09-29","short":"Assembly v6","date":"2026-09-29"},{"id":"assembly-v7","name":"Full buoy assembly v7 (larger-flange housing)","when":"2026-10-06","short":"Assembly v7","date":"2026-10-06"},{"id":"mushroom","name":"Mushroom-profile printed float (no foam, no ballast stem)","when":"2026-10-23, CAD exported 2026-10-28","short":"Mushroom-profile printed float","date":"2026-10-23"},{"id":"ta9","name":"Test Assembly 9 (printed float)","when":"2026-11-11, CAD exported 2026-11-13","short":"Test Assembly 9","date":"2026-11-11"},{"id":"ta10","name":"Test Assembly 10 (printed float)","when":"2026-11-12, CAD exported 2026-11-13","short":"Test Assembly 10","date":"2026-11-12"}];
(function(){
const $=id=>document.getElementById(id),N=DESIGNS.length,strip=$('strip');
if(parent===window)document.body.classList.add('solo');
const still=matchMedia('(prefers-reduced-motion:reduce)');
let cur=N-1;
const chips=DESIGNS.map((x,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('role','radio');
  b.title=x.name;b.innerHTML='<span class="i"></span><span class="t"></span><span class="d"></span>';
  b.querySelector('.i').textContent=String(i+1).padStart(2,'0');b.querySelector('.t').textContent=x.short;b.querySelector('.d').textContent=x.date;
  b.addEventListener('click',()=>pick(i,true));strip.appendChild(b);return b});
const frames=[['vf',(f,id)=>f.postMessage({model:id},location.origin)],['sf',(f,id)=>f.postMessage({design:id},location.origin)]];
function send(){const id=DESIGNS[cur].id;frames.forEach(([fid,fn])=>{const w=$(fid).contentWindow;if(w)fn(w,id)})}
function pick(i,focus){cur=Math.max(0,Math.min(N-1,i));const x=DESIGNS[cur],c=chips[cur];
  $('cnt').textContent=(cur+1)+' of '+N;$('nm').textContent=x.name;$('wh').textContent=x.when;
  chips.forEach((b,k)=>{const on=k===cur;b.setAttribute('aria-checked',on);b.tabIndex=on?0:-1});
  strip.scrollTo({left:c.offsetLeft-(strip.clientWidth-c.offsetWidth)/2,behavior:still.matches||!focus?'auto':'smooth'});
  if(focus)c.focus({preventScroll:true});
  send();try{history.replaceState(null,'','#'+x.id)}catch(e){}}
document.addEventListener('keydown',e=>{
  if(e.key==='Home'||e.key==='End'){pick(e.key==='Home'?0:N-1,true);e.preventDefault();return}
  const step={ArrowLeft:-1,ArrowUp:-1,ArrowRight:1,ArrowDown:1}[e.key];if(step){pick(cur+step,true);e.preventDefault()}});
// A design can be linked to as #<id>. Each frame is told again when it finishes loading, since it starts on its own default.
const h=location.hash.slice(1),k=DESIGNS.findIndex(x=>x.id===h);if(k>=0)cur=k;
['vf','sf'].forEach(f=>$(f).addEventListener('load',send));
// Frames report their own content height; fit each, then report this page's height to the Technology page.
function fitSelf(){parent!==window&&parent.postMessage({scoutFit:Math.ceil(document.body.getBoundingClientRect().height),from:'design-explorer'},location.origin)}
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||!e.data.scoutFit)return;
  ['vf','sf'].forEach(f=>{if($(f).contentWindow===e.source)$(f).style.height=e.data.scoutFit+'px'});fitSelf()});
new ResizeObserver(fitSelf).observe(document.body);
pick(cur,false);
})();
</script>
</body>
</html>
