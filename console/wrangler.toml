name = "scout-console"
main = "worker/index.js"
compatibility_date = "2025-10-01"

# The console's address (2026-10-30). Cloudflare creates the DNS record and certificate on deploy;
# the scoutscu.com zone must already be in the same Cloudflare account. workers.dev stays on so
# shore stations flashed with the old URL keep pushing; browsers there are sent here (index.js).
routes = [{ pattern = "console.scoutscu.com", custom_domain = true }]
workers_dev = true

# The front end (console/web, a Next.js static export). Build it first: cd web && npm run build.
# run_worker_first: every request reaches the Worker, which serves /api and /auth itself and
# gives each HTML page a fresh script nonce and CSP before it leaves (worker/index.js).
[assets]
directory = "./web/out"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Public config only. Secrets are set with `wrangler secret put` and never committed:
#   GITHUB_CLIENT_SECRET, GOOGLE_CLIENT_SECRET, GEMINI_API_KEY (Fred; locally in .dev.vars)
[vars]
APP_URL = "https://console.scoutscu.com"
BOOTSTRAP_ADMIN_EMAIL = ""                              # first admin; only used while no users exist
GITHUB_CLIENT_ID = ""
GOOGLE_CLIENT_ID = ""
# Fred's questions a day per person (ADR-0013). Google changes the free tier's limits without
# notice, so these are vars, not code. Members and admins share one cap; guests get a lower one.
ASSISTANT_DAILY_CAP = "40"
ASSISTANT_DAILY_CAP_GUEST = "10"

# Fred's fallback when Gemini is rate-limited (Workers AI, free allocation). `wrangler dev` runs it
# against the real service, so it needs `wrangler login` locally.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "scout-console"
# From `wrangler d1 create scout-console`. Not a secret, but specific to the owner's account.
database_id = "7d99a9ad-151d-417f-9113-52490c04382e"
migrations_dir = "migrations"

# Files: nightly backups and downloadable reports (Phase E/D, SCO-241). Every call goes through
# worker/storage.js, which caps operations and stored bytes well under R2's free tier. The bucket
# (Standard storage class) has lifecycle rules deleting backups/ after 35 days, reports/ after 2,
# anything else after 60, and unfinished uploads after 1 (console/README.md → Storage guardrails).
[[r2_buckets]]
binding = "FILES"
bucket_name = "scout-console-files"

# The nightly backup to R2 and Fred's morning brief, at 10:30 UTC (00:30 in Hawaii, after the
# buoys' 00:10 slot).
[triggers]
crons = ["30 10 * * *"]

