<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buoy 3D viewer</title>
<style>
:root{color-scheme:light;--bg:#f8f3ef;--card:#fffcfa;--text:#2b2520;--muted:#534c45;--border:#867f78;--line:rgba(43,37,32,.14);--accent:#1f6763;--tint:#d6eeeb;--stage:#ece4dc}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#1d1916;--card:#26211d;--text:#f1e9e2;--muted:#c9bfb5;--border:#8d857c;--line:rgba(241,233,226,.16);--accent:#6fc7c0;--tint:#24413f;--stage:#14110f}}
:root[data-theme=dark]{color-scheme:dark;--bg:#1d1916;--card:#26211d;--text:#f1e9e2;--muted:#c9bfb5;--border:#8d857c;--line:rgba(241,233,226,.16);--accent:#6fc7c0;--tint:#24413f;--stage:#14110f}
*{box-sizing:border-box}
body{margin:0;padding:clamp(12px,2.4vw,24px);background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}
h1{font-size:1.15rem;font-weight:600;margin:0 0 .25rem}
p.note{font-size:.88rem;color:var(--muted);margin:0 0 .8rem;max-width:68ch}
code,.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.85em}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0 0 10px}
select,button{font:inherit;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:.3rem .9rem;cursor:pointer}
select{border-radius:6px;padding:.35rem .6rem;min-width:min(100%,280px);flex:1;max-width:420px}
button:hover{background:var(--tint)}
button[aria-pressed=true]{background:var(--tint);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px}
@media (max-width:760px){.main{grid-template-columns:1fr}}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);aspect-ratio:4/3;min-height:300px;touch-action:none}
.stage canvas{width:100%;height:100%;display:block}
.hint{position:absolute;left:10px;bottom:8px;font-size:.75rem;color:var(--muted);pointer-events:none}
.dims{position:absolute;right:10px;top:8px;font-size:.78rem;text-align:right;color:var(--muted);pointer-events:none}
.side{background:var(--card);border:1px solid var(--line);padding:.6rem .75rem;font-size:.88rem;max-height:560px;overflow:auto}
.side h2{font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 .4rem;font-weight:600}
.part{display:flex;align-items:center;gap:8px;padding:2px 0}
.part label{display:flex;align-items:center;gap:7px;flex:1;min-width:0;cursor:pointer}
.part .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part .sw{width:11px;height:11px;border-radius:2px;flex:none;border:1px solid var(--line)}
.part .n{color:var(--muted);font-size:.75rem}
.part:hover{background:var(--tint)}
input[type=checkbox]{accent-color:var(--accent)}
input[type=range]{accent-color:var(--accent);width:100%}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;margin:.7rem 0 0;font-size:.85rem}
.ctl span.v{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.78rem;color:var(--muted);min-width:4.2em;text-align:right}
.src{margin:.7rem 0 0;font-size:.78rem;color:var(--muted);word-break:break-all}
</style>
</head>
<body>
<h1>Buoy 3D viewer</h1>
<p class="note">Pick a design, drag to turn it, scroll to zoom. Switch parts off to look inside, spread them apart, or cut it in half. Every shape is drawn straight from the CAD file.</p>
<div class="bar">
  <button id="prev" aria-label="Previous design">&larr;</button>
  <select id="model" aria-label="Design"></select>
  <button id="next" aria-label="Next design">&rarr;</button>
  <button id="wire" aria-pressed="false">Wireframe</button>
  <button id="reset">Reset view</button>
</div>
<div class="main">
  <div class="stage" id="stage">
    <div class="dims mono" id="dims"></div>
    <div class="hint">Drag: turn &middot; Scroll: zoom &middot; Right-drag: move</div>
  </div>
  <div class="side">
    <h2 id="blurb"></h2>
    <div id="parts"></div>
    <div class="ctl">
      <label for="explode">Spread apart</label><input id="explode" type="range" min="0" max="100" value="0"><span class="v" id="explodeV">0%</span>
      <label for="cut">Cut through</label><input id="cut" type="range" min="0" max="100" value="100"><span class="v" id="cutV">off</span>
    </div>
    <div class="src mono" id="src"></div>
  </div>
</div>
<script>/*THREE*/</script>
<script>/*CONTROLS*/</script>
<script>
const MODELS = /*MODELS*/;
(function(){
const $=id=>document.getElementById(id);
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.localClippingEnabled=true;
stage.insertBefore(renderer.domElement,stage.firstChild);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,1,20000);
camera.up.set(0,0,1);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a7f75,0.75));
const key=new THREE.DirectionalLight(0xffffff,0.85);key.position.set(400,-600,900);scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,0.3);fill.position.set(-500,400,-200);scene.add(fill);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

// Colour by part size so the housing, hardware and float read apart without any naming rules.
const PALETTE=['#378ADD','#1f6763','#BA7517','#7a6fb5','#c0565a','#5c8f3a','#8a8178','#2a9d8f'];
const clip=new THREE.Plane(new THREE.Vector3(-1,0,0),0);
let root=null,groups=[],bbox=null,home=null,cur=null;

function b64(s,T){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new T(u.buffer)}
// "Component1:1 (3)" -> "Component1"; CAD placeholders become "Unnamed part" so the list stays honest.
function base(n){return n.replace(/ \(\d+\)$/,'').replace(/:\d+$/,'')}
function pretty(n,vol){
  if(/^(Component\d*|=>.*|Body\d*)$/.test(n)) return 'Unnamed part ('+vol.toFixed(0)+' cm³)';
  const m=n.match(/^([0-9A-Z]{6,8})_(.*)$/); return m?m[2]+' ('+m[1]+')':n;
}

function load(id){
  const d=MODELS.find(m=>m.id===id);cur=d;
  if(root){scene.remove(root);root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()})}
  root=new THREE.Group();scene.add(root);
  const byName=new Map();
  d.parts.forEach(p=>{
    const g=new THREE.BufferGeometry();
    const v=b64(p.verts,Float32Array);
    g.setAttribute('position',new THREE.BufferAttribute(v,3));
    g.setIndex(new THREE.BufferAttribute(b64(p.tris,Uint32Array),1));
    g.computeVertexNormals();g.computeBoundingBox();
    const key=base(p.name)+'|'+p.volume_cm3;
    let grp=byName.get(key);
    if(!grp){grp={key,label:pretty(base(p.name),p.volume_cm3),meshes:[],vol:p.volume_cm3,color:null,visible:true};byName.set(key,grp)}
    const mesh=new THREE.Mesh(g,null);mesh.userData.grp=grp;grp.meshes.push(mesh);root.add(mesh);
  });
  groups=[...byName.values()].sort((a,b)=>b.vol-a.vol);
  groups.forEach((g,i)=>{
    g.color=PALETTE[i%PALETTE.length];
    g.meshes.forEach(m=>{
      m.material=new THREE.MeshStandardMaterial({color:g.color,roughness:.55,metalness:.08,side:THREE.DoubleSide,clippingPlanes:[clip],flatShading:false});
      m.geometry.computeBoundingBox();
      const c=new THREE.Vector3();m.geometry.boundingBox.getCenter(c);m.userData.centre=c;m.userData.homePos=new THREE.Vector3();
    });
  });
  const lo=d.bbox_mm[0],hi=d.bbox_mm[1];
  bbox=new THREE.Box3(new THREE.Vector3(...lo),new THREE.Vector3(...hi));
  const sz=bbox.getSize(new THREE.Vector3());
  $('dims').innerHTML=[sz.x,sz.y,sz.z].map(v=>v.toFixed(0)).join(' × ')+' mm<br>'+[sz.x,sz.y,sz.z].map(v=>(v/25.4).toFixed(1)).join(' × ')+' in<br>W × D × H';
  $('blurb').textContent=d.blurb;$('src').textContent=d.source;
  $('explode').value=0;$('cut').value=100;
  buildList();applyAll();frame();
}
function buildList(){
  const box=$('parts');box.innerHTML='';
  groups.forEach(g=>{
    const row=document.createElement('div');row.className='part';
    const l=document.createElement('label');l.title=g.label;
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;
    cb.onchange=()=>{g.visible=cb.checked;applyAll()};
    const sw=document.createElement('span');sw.className='sw';sw.style.background=g.color;
    const nm=document.createElement('span');nm.className='nm';nm.textContent=g.label;
    l.append(cb,sw,nm);
    if(g.meshes.length>1){const n=document.createElement('span');n.className='n';n.textContent='×'+g.meshes.length;l.append(n)}
    row.append(l);
    row.onmouseenter=()=>hover(g);row.onmouseleave=()=>hover(null);
    box.append(row);
  });
}
function hover(g){
  groups.forEach(x=>x.meshes.forEach(m=>{
    m.material.emissive.set(g&&x===g?0x333333:0x000000);
    m.material.opacity=g&&x!==g?.25:1;m.material.transparent=!!g&&x!==g;
  }));
}
function applyAll(){
  const w=$('wire').getAttribute('aria-pressed')==='true';
  const ex=$('explode').value/100;$('explodeV').textContent=Math.round(ex*100)+'%';
  const c=bbox.getCenter(new THREE.Vector3()),span=bbox.getSize(new THREE.Vector3()).length();
  groups.forEach(g=>g.meshes.forEach(m=>{
    m.visible=g.visible;m.material.wireframe=w;
    // Spread each part away from the model centre; vertical gaps count double so stacked sections separate.
    const dir=m.userData.centre.clone().sub(c);dir.z*=2;
    if(dir.lengthSq()>1)dir.normalize();else dir.set(0,0,0);
    m.position.copy(dir.multiplyScalar(ex*span*0.2));
  }));
  const cut=$('cut').value/100;
  if(cut>=1){clip.constant=1e9;$('cutV').textContent='off'}
  else{const x=bbox.min.x+(bbox.max.x-bbox.min.x)*cut;clip.constant=x;$('cutV').textContent=Math.round(x)+' mm'}
}
function frame(){
  const c=bbox.getCenter(new THREE.Vector3()),s=bbox.getSize(new THREE.Vector3()).length();
  controls.target.copy(c);
  camera.position.set(c.x+s*0.85,c.y-s*1.1,c.z+s*0.55);
  camera.near=s/100;camera.far=s*20;camera.updateProjectionMatrix();controls.update();
  home={p:camera.position.clone(),t:c.clone()};
}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);

const sel=$('model');
MODELS.forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.label;sel.append(o)});
sel.onchange=()=>load(sel.value);
function step(d){sel.selectedIndex=(sel.selectedIndex+d+MODELS.length)%MODELS.length;load(sel.value)}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.type==='range')return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
$('wire').onclick=e=>{e.currentTarget.setAttribute('aria-pressed',e.currentTarget.getAttribute('aria-pressed')!=='true');applyAll()};
$('reset').onclick=()=>{camera.position.copy(home.p);controls.target.copy(home.t);controls.update()};
$('explode').oninput=applyAll;$('cut').oninput=applyAll;
// Linked pages can pick a design with ?model=<id> or postMessage({model:'<id>'}).
addEventListener('message',e=>{if(e.data&&e.data.model&&MODELS.some(m=>m.id===e.data.model)){sel.value=e.data.model;load(e.data.model)}});
const q=new URLSearchParams(location.search).get('model');
load(MODELS.some(m=>m.id===q)?q:MODELS[0].id);sel.value=cur.id;resize();
(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
})();
</script>
</body>
</html>
