name: CI

# Runs the full test suite on every push to main and every PR. No hardware, no external
# services — the Python suites are standard-library only; the firmware native tests build the
# hardware-free libraries (packet, scheduler) on the host via PlatformIO.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    name: Python (shore · telemetry · packet contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shore tests
        working-directory: shore
        run: python -m unittest discover -s tests -v

      - name: Telemetry tests
        working-directory: analytics
        run: python -m unittest discover -s telemetry/tests -t . -v

      # The acoustic summary reference (ADR-0010) is the spec the firmware ports; these tests
      # also fail if config.h or the firmware's golden vectors drift from it.
      - name: Acoustic summary reference tests
        working-directory: analytics
        run: python -m unittest discover -s utils/tests -t . -v

      - name: Packet contract guard (firmware GOLDEN == shore encoder)
        run: python scripts/check_packet_contract.py

  console-tests:
    # The S.C.O.U.T. Console (console/, ADR-0012): the real Worker and D1 migration against
    # Node's built-in SQLite, with no npm install. node:sqlite needs Node 22.13 or later.
    name: Console (Worker) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Console tests
        working-directory: console
        run: npm test

  firmware-tests:
    # Do NOT rename: the "Protect main" ruleset matches required checks by this exact
    # string, and a rename silently leaves the PR waiting on a check that never reports.
    name: Firmware native unit tests (packet · scheduler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Toolchain + libraries are ~200 MB; without this every run re-downloads them.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run native tests
        working-directory: firmware
        run: pio test -e native -v

      # The native env excludes src/ and never includes CMSIS, so it cannot catch a
      # compile break in main.cpp or the drivers — which is exactly how three of them
      # reached main unnoticed. Build the real target so that cannot happen again.
      - name: Build for the Feather M0 target
        working-directory: firmware
        # Also the bench build and the bench receiver (SCO-155): both are what the first
        # hardware tests flash, so a break there should fail CI, not the bench session.
        # The two *_downlink envs compile the SCO-198 settings downlink, which is off in every
        # shipped build, so the flagged code cannot rot unnoticed. Compile check only.
        run: pio run -e feather_m0 -e feather_m0_bench -e feather_m0_rx -e feather_esp32s3_shore -e feather_m0_downlink -e feather_esp32s3_shore_downlink
