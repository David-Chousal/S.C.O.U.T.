name: Archive closed Linear issues

# The Linear workspace is on the free plan, which caps issues that are not archived. Every Done
# and Canceled issue in the S.C.O.U.T. team is archived daily (decision log 2026-10-30). Needs the
# LINEAR_API_KEY repository secret; see CLAUDE.md → "Archiving closed issues".

on:
  schedule:
    - cron: "0 13 * * *" # 06:00 Pacific (daylight time)
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archive Done and Canceled issues
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: python scripts/archive_linear_issues.py
