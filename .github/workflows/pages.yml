name: Telemetry dashboard (GitHub Pages)

# Regenerates the static telemetry dashboard and deploys it to GitHub Pages.
#
# Data source is chosen by shore/scout_shore/publish.py, not hardcoded here:
#
#   shore/data-live/ holds a CSV  →  publish it, no sample banner
#   shore/data-live/ is empty     →  run the shore simulator, label the page as sample data
#
# Real data always wins. This branch exists because the workflow used to regenerate the
# simulator unconditionally on an hourly cron: the first real CSV would have been overwritten
# within the hour, and the dashboard would have silently reverted to simulated readings with
# no error and no failed check. See publish.py for the full reasoning.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "analytics/**"
      - "shore/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"  # hourly refresh

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress deploy; let queued runs settle.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Choose the data source (real telemetry, else the simulator)
        id: source
        working-directory: shore
        run: python -m scout_shore.publish --live-dir data-live --sample-dir data >> "$GITHUB_OUTPUT"

      - name: Report the choice
        run: |
          echo "Publishing from: ${{ steps.source.outputs.source }}"
          echo "Simulated:       ${{ steps.source.outputs.simulate }}"

      # Skipped entirely once real telemetry exists, and it writes to the scratch directory
      # either way — it has no path to shore/data-live/.
      - name: Generate sample telemetry (shore simulator → CSVs)
        if: steps.source.outputs.simulate == 'true'
        working-directory: shore
        run: |
          # 30 days at the 30-min cadence, entirely stdlib — no pip install needed.
          python scripts/run_loopback.py --count 1440 --out data

      - name: Build the dashboard (QC → DHW → trends → static site)
        working-directory: analytics
        env:
          # Via env, not inline `${{ }}`: keeps the banner text out of the shell command line
          # and lets an empty banner mean "pass no flag" without expression gymnastics.
          SOURCE_DIR: ${{ steps.source.outputs.source }}
          BANNER: ${{ steps.source.outputs.banner }}
        run: |
          args=(--source "../shore/$SOURCE_DIR" --mmm 27.6 --out data/processed --web ../site)
          # Real telemetry gets no banner at all; only the simulator is labelled.
          [ -n "$BANNER" ] && args+=(--banner "$BANNER")
          python run_telemetry.py "${args[@]}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
