<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.C.O.U.T. Advisor Progress Sheet</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1b2330; --muted: #5d6878; --line: #d9dee6;
    --pass: #2f8f5b; --partial: #d99a1d; --fail: #c8472f; --untested: #7d8899; --accent: #1f5fae;
    --pass-bg: #e3f3ea; --partial-bg: #fbf1dc; --fail-bg: #f9e4df; --untested-bg: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141b; --card: #171e28; --ink: #e6ebf2; --muted: #98a4b5; --line: #2b3442;
      --pass: #4cc084; --partial: #f0b84a; --fail: #ef7b64; --untested: #8d99ad; --accent: #6aa7f0;
      --pass-bg: #14301f; --partial-bg: #33280f; --fail-bg: #36191a; --untested-bg: #1d2531;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.35 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .page { max-width: 1320px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 5px; }
  .sub { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .gantt-wrap { margin-bottom: 10px; }
  svg text { font: 11px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--ink); }
  svg .muted { fill: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 11px; margin-top: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .lane h3 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; }
  .lane h3 small { color: var(--muted); font-weight: 400; font-size: 11px; }
  .lane h2 { margin-top: 8px; }
  .late { color: var(--fail); font-weight: 600; }
  .chip { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 2px; }
  .chip span { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; }
  .chip .pass { background: var(--pass-bg); color: var(--pass); }
  .chip .partial { background: var(--partial-bg); color: var(--partial); }
  .chip .fail { background: var(--fail-bg); color: var(--fail); }
  .chip .untested { background: var(--untested-bg); color: var(--untested); }
  .wk { list-style: none; padding: 0; }
  .wk li { border-left: 3px solid var(--accent); padding: 2px 0 2px 8px; margin-bottom: 6px; }
  .wk .steps { margin: 2px 0 2px 0; padding-left: 16px; font-size: 12px; color: var(--ink); }
  .wk .steps li { border: 0; padding: 0; margin: 0; }
  .wk .did { font-weight: 600; }
  .wk .made, .wk .adv { display: block; font-size: 12px; }
  .wk .adv { color: var(--muted); }
  .planline { color: var(--muted); font-size: 11px; margin-top: 4px; }
  ul { margin: 0; padding-left: 16px; }
  li { margin-bottom: 2px; }
  .tag { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 3px; background: var(--untested-bg); color: var(--muted); border: 1px solid var(--line); margin-left: 3px; white-space: nowrap; }
  .tag.stuck { background: var(--fail-bg); color: var(--fail); border-color: var(--fail); }
  .tag.ev { background: var(--pass-bg); color: var(--pass); border-color: var(--pass); }
  .tag.sug { background: var(--partial-bg); color: var(--partial); border-color: var(--partial); }
  .why { display: block; color: var(--muted); font-size: 11px; }
  .unconfirmed { background: var(--partial-bg); border: 1px dashed var(--partial); color: var(--ink); border-radius: 5px; padding: 2px 6px; font-size: 11px; margin-bottom: 4px; }
  .bottom { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 8px; }
  footer { margin-top: 8px; color: var(--muted); font-size: 11px; }
  @media (max-width: 900px) { .lanes { grid-template-columns: 1fr; } .gantt-wrap { overflow-x: auto; } }
  @media print {
    @page { size: landscape; margin: 6mm; }
    body { background: #fff; font-size: 9.5px; }
    .page { padding: 0; max-width: none; zoom: .72; }
    .card { break-inside: avoid; }
    .lanes { grid-template-columns: repeat(3, 1fr) !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>S.C.O.U.T. &middot; Advisor Progress Sheet</h1>
    <div class="sub" id="subtitle"></div>
  </header>

  <section class="card gantt-wrap">
    <h2>Where we are in the project</h2>
    <svg id="gantt" width="100%" viewBox="0 0 1290 250" role="img" aria-label="Phase Gantt chart with today marker"></svg>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>Milestones done (issue-based)</span>
      <span><i style="background:var(--line)"></i>Phase window</span>
      <span><i style="background:none;border:1.5px solid var(--fail)"></i>Time elapsed past work done</span>
      <span>&#9670; milestone (filled = complete)</span>
      <span style="color:var(--fail)">&#9474; today</span>
    </div>
  </section>

  <section class="lanes" id="lanes"></section>

  <section class="bottom">
    <div class="card"><h2>Asks for the advisors</h2><ul id="asks"></ul></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
/* ---- DATA: regenerated each week by the skill from Linear, git, test register ---- */
const DATA = {
  today: "2026-10-22",
  weekStart: "2026-10-15",
  currentPhase: 1,
  nextConfirmed: false,
  phases: [
    { n: 0, name: "Kickoff",                  start: "2026-08-14", end: "2026-09-20", progress: 100 },
    { n: 1, name: "Subsystem Bring-Up",       start: "2026-09-07", end: "2026-10-23", progress: 64 },
    { n: 2, name: "System Integration",       start: "2026-10-22", end: "2026-12-06", progress: 10 },
    { n: 3, name: "Enclosure & Waterproofing",start: "2026-11-30", end: "2027-01-15", progress: 55 },
    { n: 4, name: "Field Prototype",          start: "2027-01-18", end: "2027-02-26", progress: 11 },
    { n: 5, name: "Hawaii Prep",              start: "2027-03-01", end: "2027-03-19", progress: 22 },
    { n: 6, name: "Hawaii Live Deployment",   start: "2027-03-22", end: "2027-05-28", progress: 0 }
  ],
  milestones: [
    [0,"2026-08-21",100],[0,"2026-08-28",100],[0,"2026-09-11",100],[0,"2026-09-18",100],
    [1,"2026-09-30",54],[1,"2026-10-09",94],[1,"2026-10-14",50],[1,"2026-10-16",32],[1,"2026-10-20",75],[1,"2026-10-21",85],[1,"2026-10-23",55],
    [2,"2026-10-30",0],[2,"2026-11-06",28],[2,"2026-11-13",0],[2,"2026-11-20",0],[2,"2026-11-25",50],[2,"2026-12-02",0],[2,"2026-12-04",0],[2,"2026-12-06",0],
    [3,"2026-12-04",50],[3,"2026-12-11",100],[3,"2026-12-18",0],[3,"2027-01-08",100],[3,"2027-01-15",25],
    [4,"2027-01-29",0],[4,"2027-02-12",0],[4,"2027-02-19",0],[4,"2027-02-26",42],
    [5,"2027-03-05",25],[5,"2027-03-12",40],[5,"2027-03-19",0],
    [6,"2027-03-26",0],[6,"2027-04-23",0],[6,"2027-05-21",0],[6,"2027-05-28",0]
  ],
  /* Criteria feed only the pass/partial/untested chip. status: pass | partial | fail | untested.
     Evidence = test-register row or Linear issue (kept in r, shown on hover). */
  /* week: 2-4 plain-English bullets per person. did = what they did, no jargon; steps = 2-3
     short concrete actions in order (printed, soaked, measured...), from the person's own words; made = the
     concrete completion or state change; adv = the subsystem/initiative it advances and why
     that moves the project. id = Linear issue / PR as evidence. plan = last week's committed
     steps scored, one line. */
  lanes: [
    { key: "ECEN", who: "Isabella Rodriguez",
      criteria: [
        { t: "Bench breadboard reads DS18B20, PCF8523, microSD, SEN0189", s: "untested", r: "SCO-152 Todo" },
        { t: "Sleep current < 5 mA", s: "untested", r: "SCO-23 Todo, nothing measured yet" },
        { t: "Per-sensor power switching", s: "untested", r: "SCO-87 Todo" },
        { t: "RFM95 link on FCC-compliant config", s: "untested", r: "SCO-155 in progress; modem config SCO-98" }
      ],
      week: [
        { did: "Ordered every part needed for one complete buoy and its shore station.", steps: ["[person to add the steps taken]"], made: "Order placed.", adv: "Electronics bench bring-up: parts are in hand, so bench tests can start.", id: "SCO-115" },
        { did: "Chose the hydrophone part and took the electronics design to Dr. Krishnan.", steps: ["[person to add the steps taken]"], made: "Part confirmed; design reviewed.", adv: "Sensing and power subsystems: the design is now reviewed rather than assumed.", id: "SCO-8, SCO-116" },
        { did: "Gave the mechanical side the final component list and dimensions.", steps: ["[person to add the steps taken]"], made: "Delivered.", adv: "Housing design: lets the enclosure be sized around real parts.", id: "SCO-70" }
      ],
      stuck: [
        ["Charging path undecided", "Blocked", "waits on the sleep-current measurement, not started (SCO-10, SCO-23)"],
        ["Battery-voltage telemetry", "Blocked", "waits on the charging path (SCO-83)"]
      ],
      next: [
        { t: "Bring up the bench breadboard", id: "SCO-152", who: "Isabella", done: "all four sensors read", src: "suggested" },
        { t: "Measure sleep current", id: "SCO-23", who: "Isabella", done: "value recorded vs < 5 mA", src: "suggested" },
        { t: "Design the SEN0189 front end as non-inverting", id: "SCO-47", who: "Isabella", done: "[team to add]", src: "ondeck" },
        { t: "Decide the LiFePO4 charging path", id: "SCO-10", who: "Isabella", done: "ADR-0002 Accepted and facts.md updated", src: "ondeck" }
      ],
      plan: "First sheet: no commitments were recorded last week." },
    { key: "CSEN", who: "David Chousal Cantu",
      criteria: [
        { t: "SAMD21 drivers validated on real hardware", s: "untested", r: "SCO-25 blocked by SCO-152" },
        { t: "Real shore LoRa receiver", s: "untested", r: "SCO-24 In Progress" },
        { t: "Shore data path and analytics", s: "partial", r: "passes in simulation, not on a real radio" },
        { t: "RFM95 link on FCC-compliant config", s: "untested", r: "shared with ECEN" }
      ],
      week: [
        { did: "Decided how often the buoy sends data and what wakes it up.", steps: ["[person to add the steps taken]"], made: "Decision recorded.", adv: "Firmware and power budget: fixes the daily schedule everything else is sized to.", id: "SCO-196" },
        { did: "Reviewed the FCC 915 MHz findings with faculty and compliance.", steps: ["[person to add the steps taken]"], made: "Review done.", adv: "Radio link: confirms what settings the buoy may legally transmit with.", id: "SCO-104" },
        { did: "Resolved the conflict between two LoRa settings (SF12 vs SF7) in the facts file.", steps: ["[person to add the steps taken]"], made: "facts.md reconciled.", adv: "Shore station: firmware and docs now agree on one radio setting.", id: "SCO-213" }
      ],
      stuck: [
        ["Drivers on real hardware", "Blocked", "waits on the bench breadboard (SCO-25, SCO-152)"],
        ["Turbidity to NTU calibration", "Blocked", "waits on sensor measurements and front-end design (SCO-12)"]
      ],
      next: [
        { t: "Bring up the real LoRa receiver on the shore station", id: "SCO-24", who: "David", done: "[team to add]", src: "ondeck" },
        { t: "Make analytics CLI flags consistent", id: "SCO-26", who: "David", done: "flags consistent or documented", src: "ondeck" }
      ],
      plan: "First sheet: no commitments were recorded last week." },
    { key: "GENG", who: "John Ryan Myrdal",
      criteria: [
        { t: "Hull survives mooring and wave loads", s: "pass", r: "RR-04 SF 10-1450; v5 re-check RR-09" },
        { t: "Buoy rights itself from any angle", s: "partial", r: "v6 with 24 in ballast passed (RR-11); current no-stem printed float not re-checked" },
        { t: "Sensor-pod face seal stays dry", s: "partial", r: "RR-18 passed in fresh water, shallow; salt and depth untested" },
        { t: "Assembled buoy floats at modelled waterline", s: "partial", r: "RR-17 floated well; seams leaked slightly; run without foam" },
        { t: "Test sites and permits", s: "partial", r: "research written; determinations not recorded in the repo" }
      ],
      week: [
        { did: "Rebuilt and checked the seal where the turbidity sensor meets the buoy.", steps: ["[person to add the steps taken]"], made: "Validated.", adv: "Sensor pod and sealing: the water-tight joint the turbidity sensor depends on.", id: "SCO-91" },
        { did: "Designed the top of the chassis with a sealed service-access port.", steps: ["[person to add the steps taken]"], made: "Section designed.", adv: "Enclosure: lets the electronics be reached without breaking the seal.", id: "SCO-68" },
        { did: "Found a source for the plastic (PETG) for the second buoy.", steps: ["[person to add the steps taken]"], made: "Sourced.", adv: "Fabrication: the second unit can be printed.", id: "SCO-167" }
      ],
      stuck: [["Foam-filled second unit", "Deferred", "parked by choice (SCO-166, SCO-178)"]],
      next: [
        { t: "Start saltwater-bath leak tests on printed capsules (1, 2, 3 walls)", id: "SCO-141", who: "John Ryan", done: "capsules soaking with a moisture indicator", src: "ondeck" },
        { t: "Finish submersion re-test of the face-seal joint", id: "SCO-108", who: "John Ryan", done: "[team to add]", src: "suggested" }
      ],
      plan: "First sheet: no commitments were recorded last week." }
  ],
  asks: [
    "Decision: LiFePO4 charging path (SCO-10, ADR-0002), open since Phase 0.",
    "Signature: corrected hazard form (SCO-211).",
    "Review: permitting and tethering research (SCO-199)."
  ]
};

/* ---- render ---- */
const D = s => new Date(s + "T00:00:00Z").getTime();
const DAY = 86400000;
const today = D(DATA.today);
const fmt = s => new Date(D(s)).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

const p = DATA.phases[DATA.currentPhase];
const elapsed = Math.min(100, Math.round((today - D(p.start)) / (D(p.end) - D(p.start)) * 100));
document.getElementById("subtitle").textContent =
  `Week of ${fmt(DATA.weekStart)} – ${fmt(DATA.today)}, 2026 · Phase ${p.n}: ${p.name} · ${elapsed >= 100 ? `phase window ended ${fmt(p.end)}` : elapsed + "% of phase time elapsed"}, ${p.progress}% of milestone issues done`;

/* gantt */
const svg = document.getElementById("gantt");
const X0 = 190, X1 = 1270, rowH = 26, gTop = 30;
const tMin = D(DATA.phases[0].start), tMax = D(DATA.phases[6].end);
const x = t => X0 + (t - tMin) / (tMax - tMin) * (X1 - X0);
let g = "";
for (let t = new Date(Date.UTC(2026, 7, 1)); t.getTime() <= tMax; t.setUTCMonth(t.getUTCMonth() + 1)) {
  const tx = x(Math.max(t.getTime(), tMin));
  g += `<line x1="${tx}" x2="${tx}" y1="${gTop - 6}" y2="${gTop + rowH * 7 + 4}" stroke="var(--line)" stroke-width="1"/>`;
  g += `<text class="muted" x="${tx + 3}" y="${gTop - 12}">${t.toLocaleDateString("en-US", { month: "short", timeZone: "UTC" })}${t.getUTCMonth() === 0 ? " '27" : ""}</text>`;
}
DATA.phases.forEach((ph, i) => {
  const y = gTop + i * rowH, xs = x(D(ph.start)), xe = x(D(ph.end)), w = xe - xs;
  const cur = ph.n === DATA.currentPhase;
  g += `<text x="6" y="${y + 15}" ${cur ? 'font-weight="700"' : ""}>P${ph.n} ${ph.name}</text>`;
  g += `<rect x="${xs}" y="${y + 4}" width="${w}" height="16" rx="3" fill="var(--line)" ${cur ? 'stroke="var(--accent)" stroke-width="1.5"' : ""}/>`;
  g += `<rect x="${xs}" y="${y + 4}" width="${w * ph.progress / 100}" height="16" rx="3" fill="var(--accent)" opacity="${ph.n < DATA.currentPhase ? .55 : .9}"/>`;
  const el = Math.max(0, Math.min(1, (today - D(ph.start)) / (D(ph.end) - D(ph.start))));
  if (el > ph.progress / 100 && el < 1.0001 && today >= D(ph.start)) {
    g += `<rect x="${xs + w * ph.progress / 100}" y="${y + 4}" width="${w * (el - ph.progress / 100)}" height="16" rx="3" fill="none" stroke="var(--fail)" stroke-width="1.5"/>`;
  }
  g += `<text x="${xe + 4}" y="${y + 16}" class="muted">${ph.progress}%</text>`;
});
DATA.milestones.forEach(([n, d, pct]) => {
  const cx = x(D(d)), cy = gTop + n * rowH + 12;
  g += `<path d="M${cx} ${cy - 5} l5 5 l-5 5 l-5 -5 z" fill="${pct >= 100 ? "var(--pass)" : "var(--card)"}" stroke="${pct >= 100 ? "var(--pass)" : "var(--ink)"}" stroke-width="1.2"/>`;
});
const tx = x(today);
g += `<line x1="${tx}" x2="${tx}" y1="${gTop - 8}" y2="${gTop + rowH * 7 + 6}" stroke="var(--fail)" stroke-width="2"/>`;
g += `<text x="${tx - 20}" y="${gTop + rowH * 7 + 20}" style="fill:var(--fail)" font-weight="700">Today ${fmt(DATA.today)}</text>`;
g += `<text x="${x(tMax) - 128}" y="${gTop + rowH * 7 + 20}" class="muted">Final report May 28, 2027</text>`;
svg.innerHTML = g;

/* lanes */
const label = { pass: "pass", partial: "partial", fail: "fail", untested: "untested" };
const chip = l => ["pass", "partial", "fail", "untested"].map(k => ({ k, n: l.criteria.filter(c => c.s === k).length }))
  .filter(c => c.n).map(c => `<span class="${c.k}" title="${esc(l.criteria.filter(x => x.s === c.k).map(x => x.t + ": " + x.r).join("\n"))}">${c.n} ${label[c.k]}</span>`).join("");
document.getElementById("lanes").innerHTML = DATA.lanes.map(l => `
  <div class="card lane">
    <h3>${l.who}<small>${l.key}</small></h3>
    <div class="chip" aria-label="Phase exit criteria">${chip(l)}</div>
    <h2>Last week <span class="tag ev">evidence</span></h2>
    <ul class="wk">${l.week.map(w => `<li><span class="did">${esc(w.did)}</span> <span class="tag">${w.id}</span>
      <ol class="steps">${w.steps.map(t => `<li>${esc(t)}</li>`).join("")}</ol>
      <span class="made"><b>Result:</b> ${esc(w.made)}</span><span class="adv"><b>Advances:</b> ${esc(w.adv)}</span></li>`).join("")}</ul>
    <div class="planline">Plan vs. actual: ${esc(l.plan)}</div>
    <h2>Challenges</h2>
    <ul>${l.stuck.map(([t, s, why]) => `<li>${esc(t)} <span class="tag stuck">${s}</span><span class="why">${esc(why)}</span></li>`).join("")}</ul>
    <h2>Next week (owner · done when)</h2>
    ${DATA.nextConfirmed ? "" : '<div class="unconfirmed">Not yet confirmed by the team. Set in the weekly sync before the meeting.</div>'}
    <ul>${l.next.map(n => `<li>${esc(n.t)} <span class="tag">${n.id}</span> <span class="tag ${n.src === "suggested" ? "sug" : ""}">${n.src === "suggested" ? "suggested by sheet" : "On Deck"}</span><span class="why">${n.who} · done when: ${esc(n.done)}</span></li>`).join("")}</ul>
  </div>`).join("");

document.getElementById("asks").innerHTML = DATA.asks.map(t => `<li>${esc(t)}</li>`).join("");
document.getElementById("footer").textContent =
  "Sources: Linear (issues, milestones, blocking relations), git, mechanical/test/risk-reduction-register.md. Generated " + DATA.today +
  ". Milestone % is issue completion, not a result. Chips count Phase exit criteria passed / partial / failed / untested from recorded tests only; hover a chip for the detail.";
</script>
</body>
</html>
