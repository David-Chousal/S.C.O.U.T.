<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.C.O.U.T. Advisor Summary</title>
<style>
  :root { --bg:#fff; --card:#f6f7f9; --ink:#1b1f24; --mute:#5b6571; --line:#dde1e6; --accent:#185FA5; --warn:#8a5a00; --warnbg:#fff4de; --ok:#1a7f4b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14171b; --card:#1d2227; --ink:#eceff2; --mute:#9aa4af; --line:#2c333a; --accent:#6db0f0; --warn:#f0c36d; --warnbg:#2b2413; --ok:#5fd394; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; }
  .page { max-width:1100px; margin:0 auto; padding:20px 16px 28px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--mute); font-size:13px; margin-bottom:12px; }
  .banner { background:var(--warnbg); color:var(--warn); border-radius:8px; padding:8px 12px; font-size:13px; margin-bottom:14px; }
  .phase { background:var(--card); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:14px; }
  .phase b { color:var(--accent); }
  .gantt { background:var(--card); border-radius:10px; padding:10px 14px; margin-bottom:14px; }
  .gantt .gl{font-size:12px;fill:var(--ink)} .gantt .gp{font-size:11px;fill:var(--mute)} .gantt .gb{fill:var(--line)} .gantt .gd{fill:var(--accent)} .gantt .gt{stroke:var(--line);stroke-dasharray:2 3} .gantt .gtd{stroke:#d9423b;stroke-width:1.5} .gantt .gtdt{font-size:11px;fill:#d9423b}
  .gantt .cap{font-size:12px;color:var(--mute);margin:4px 0 0}
  .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:820px) { .cols { grid-template-columns:1fr; } }
  .card { background:var(--card); border-radius:10px; padding:14px; }
  .card h2 { font-size:16px; margin:0 0 8px; }
  .card h2 small { color:var(--mute); font-weight:400; font-size:12px; }
  h3 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); margin:12px 0 4px; }
  ul { margin:0; padding-left:18px; }
  li { margin:0 0 6px; }
  li span { color:var(--mute); }
  .stuck li::marker { color:var(--warn); }
  .asks { margin-top:12px; }
  .asks h2 { font-size:16px; margin:0 0 6px; }
  @media print { @page { size:landscape; margin:10mm; } body { font-size:12px; } .page { padding:0; } }
</style>
</head>
<body>
<div class="page">
  <h1>S.C.O.U.T. Advisor Summary</h1>
  <div class="sub" id="sub"></div>
  <div class="banner" id="banner"></div>
  <div class="phase" id="phase"></div>
  <div class="gantt" id="gantt"></div>
  <div class="cols" id="cols"></div>
  <section class="card asks"><h2>Asks for the advisors</h2><ul id="asks"></ul></section>
</div>
<script>
/* ---- SIMPLE: regenerated each week by the skill. Same facts as template.html's DATA, cut to the

  },
  {

   "progress": 11
  },
  {

   "progress": 22
  },
  {

   "end": "2027-05-28",
   "progress": 0
  }
 ],

  {

   "done": [
    {

    },

    {

    }

    }
   ]
  }
 ],

  "Sign the corrected hazard form.",
  "Review the permitting and tethering research (not yet sent to Dr. Shaghaghi).",
  "Feedback on the dock/boat-hung V1 as our first in-water test."

};
</script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const D = x => new Date(x + "T00:00:00Z");
document.getElementById("sub").textContent = SIMPLE.weekLabel;
document.getElementById("banner").textContent = SIMPLE.nextConfirmed ? "" : "Next steps are suggestions. The team has not confirmed them yet.";
if (SIMPLE.nextConfirmed) document.getElementById("banner").remove();
document.getElementById("phase").innerHTML = "<b>Where we are:</b> " + esc(SIMPLE.phaseLine);
(function gantt() {
  const t0 = D("2026-08-14"), t1 = D("2027-05-28"), L = 190, W = 1000 - L - 10, top = 22, row = 26, n = SIMPLE.phases.length;
  const X = d => L + W * (D(d) - t0) / (t1 - t0), today = SIMPLE.today;
  let h = "";
  for (const m of ["2026-09-01", "2026-11-01", "2027-01-01", "2027-03-01", "2027-05-01"]) {
    const x = X(m); h += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="14" y2="${top + n * row}" class="gt"/><text x="${x.toFixed(1)}" y="10" text-anchor="middle" class="gp">${D(m).toLocaleString("en", {month: "short", timeZone: "UTC"})}</text>`;
  }
  SIMPLE.phases.forEach((p, i) => {
    const y = top + i * row, x0 = X(p.start), x1 = X(p.end);
    h += `<text x="${L - 8}" y="${y + 14}" text-anchor="end" class="gl">P${p.n} ${esc(p.name)}</text><rect x="${x0.toFixed(1)}" y="${y + 3}" width="${(x1 - x0).toFixed(1)}" height="16" rx="3" class="gb"/><rect x="${x0.toFixed(1)}" y="${y + 3}" width="${((x1 - x0) * p.progress / 100).toFixed(1)}" height="16" rx="3" class="gd"/><text x="${(x1 + 5).toFixed(1)}" y="${y + 15}" class="gp">${p.progress}%</text>`;
  });
  const tx = X(today);
  h += `<line x1="${tx.toFixed(1)}" x2="${tx.toFixed(1)}" y1="14" y2="${top + n * row}" class="gtd"/><text x="${tx.toFixed(1)}" y="${top + n * row + 11}" text-anchor="middle" class="gtdt">today</text>`;
  document.getElementById("gantt").innerHTML = `<svg viewBox="0 0 1030 ${top + n * row + 14}" width="100%" role="img" aria-label="Project phase timeline with progress">${h}</svg><p class="cap">Bar = phase window. Filled part = share of that phase's tasks done (not a test result).</p>`;
})();
const li = (x, cls) => `<li>${esc(x.t || x)}${x.note ? " <span>" + esc(x.note) + "</span>" : ""}</li>`;
document.getElementById("cols").innerHTML = SIMPLE.lanes.map(l =>
  `<section class="card"><h2>${esc(l.who)} <small>${esc(l.role)}</small></h2><h3>Done</h3><ul>${l.done.map(li).join("")}</ul><h3>Stuck</h3><ul class="stuck">${l.stuck.map(li).join("")}</ul><h3>Next</h3><ul>${l.next.map(li).join("")}</ul></section>`).join("");
document.getElementById("asks").innerHTML = SIMPLE.asks.map(a => "<li>" + esc(a) + "</li>").join("");
</script>
</body>
</html>
