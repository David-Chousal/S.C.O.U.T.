<body>
<p class="screen-only">S.C.O.U.T. system block diagram, SCOUT-S-000. Sheet 1 prints at 36 × 24 in (ARCH D); sheets 2–4 at 22 × 17 in (ANSI C). Use the PDF for printing.</p>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2185b"/></marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d91"/></marker>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#eef0e6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9aa07f" stroke-width="1.2"/></pattern>
    <pattern id="hatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#888" stroke-width="1"/></pattern>
    <pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#efe3c8"/><circle cx="2" cy="3" r="1" fill="#b89b62"/><circle cx="7" cy="7" r="1" fill="#b89b62"/></pattern>
  </defs>
</svg>

<div id="sheets"></div>

<script>
"use strict";
const SVGNS = "http://www.w3.org/2000/svg", XHTML = "http://www.w3.org/1999/xhtml";
let cur = null;            // current parent group
let usedNotes = null;      // Set of note numbers referenced on the sheet being drawn

function E(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
  (parent || cur).appendChild(e);
  return e;
}
function T(x, y, s, cls, anchor, rot) {
  const t = E("text", { x, y, class: cls || "t" });
  if (anchor) t.setAttribute("text-anchor", anchor);
  if (rot) t.setAttribute("transform", `rotate(${rot} ${x} ${y})`);
  String(s).split("\n").forEach((line, i) => {
    const ts = E("tspan", { x, dy: i ? "1.22em" : 0 }, t);
    ts.textContent = line;
  });
  return t;
}
function H(x, y, w, h, html, cls) {
  const f = E("foreignObject", { x, y, width: w, height: h });
  const d = document.createElementNS(XHTML, "div");
  d.setAttribute("class", cls || "fo");
  d.innerHTML = html;
  f.appendChild(d);
  return f;
}
function R(x, y, w, h, cls, extra) { return E("rect", Object.assign({ x, y, width: w, height: h, class: cls }, extra || {})); }
function card(x, y, w, h, title, html, o) {
  o = o || {};
  R(x, y, w, h, "card");
  R(x, y, w, 18, "cardhd " + (o.k ? "k-" + o.k : ""));
  T(x + 6, y + 13, title, "hd");
  if (o.ref) T(x + w - 6, y + 13, o.ref, "hdref", "end");
  if (html) H(x + 5, y + 21, w - 10, h - 23, html, "fo" + (o.small ? " small" : ""));
}
function W(pts, net, o) {
  o = o || {};
  const a = { points: pts.map(p => p.join(",")).join(" "), class: "w " + net };
  if (o.arrow === "end" || o.arrow === "both") a["marker-end"] = net === "rf" ? "url(#arr)" : "url(#ar)";
  if (o.arrow === "start" || o.arrow === "both") a["marker-start"] = net === "rf" ? "url(#arr)" : "url(#ar)";
  E("polyline", a);
  if (o.label) T(o.lx, o.ly, o.label, o.lcls || "wl", o.la, o.rot);
}
function dot(x, y, net) { E("circle", { cx: x, cy: y, r: 3, class: "dot d-" + net }); }
function B(x, y, n) {
  if (usedNotes) usedNotes.add(n);
  E("circle", { cx: x, cy: y, r: 8.5, class: "bal" });
  T(x, y + 3.6, String(n), "bal-t", "middle");
}
function IF(x, y, n) {
  const w = 38, h = 16, c = 6;
  E("polygon", { points: `${x - w/2},${y} ${x - w/2 + c},${y - h/2} ${x + w/2 - c},${y - h/2} ${x + w/2},${y} ${x + w/2 - c},${y + h/2} ${x - w/2 + c},${y + h/2}`, class: "ifhex" });
  T(x, y + 3.4, "IF-" + n, "if-t", "middle");
}
function gnd(x, y) {
  W([[x, y], [x, y + 6]], "gnd");
  W([[x - 7, y + 6], [x + 7, y + 6]], "gnd"); W([[x - 4.5, y + 9], [x + 4.5, y + 9]], "gnd"); W([[x - 2, y + 12], [x + 2, y + 12]], "gnd");
}
function dimV(x, y1, y2, label, side) {
  E("line", { x1: x, y1, x2: x, y2, class: "dimln", "marker-start": "url(#ard)", "marker-end": "url(#ard)" });
  T(x + (side === "l" ? -4 : 4), (y1 + y2) / 2 + 3, label, "dim", side === "l" ? "end" : "start");
}
function dimH(y, x1, x2, label, above) {
  E("line", { x1, y1: y, x2, y2: y, class: "dimln", "marker-start": "url(#ard)", "marker-end": "url(#ard)" });
  T((x1 + x2) / 2, y + (above === false ? 12 : -4), label, "dim", "middle");
}
function leader(x1, y1, x2, y2, label, anchor) {
  E("polyline", { points: `${x1},${y1} ${x2},${y2}`, class: "w mech", "stroke-width": .8 });
  E("circle", { cx: x1, cy: y1, r: 1.8, fill: "#333" });
  T(x2 + (anchor === "end" ? -3 : 3), y2 + 3.5, label, "ts", anchor || "start");
}
function gland(x, y, label) { R(x, y - 7, 26, 14, "gland", { rx: 2 }); T(x + 13, y + 3.5, label, "pin", "middle"); }

/* ======================================================================
   NOTES — one numbered list shared by every sheet. A sheet prints the
   notes its drawings reference; sheet 1 prints all of them.
   ====================================================================== */
const NOTES = {
 1: "Values marked † are proposed, not yet measured. Confirm each on the bench before soldering (Rev B drawing set SCOUT-E-100).",
 2: "<b>Remove the Feather's MCP73831 charger before any primary Li-SOCl₂ cell is connected.</b> It charges whatever is on BAT whenever USB is present, and charging a primary cell is a fire hazard. Bench work uses a current-limited 3.6 V supply into BAT.",
 3: "Cells in <b>parallel only</b>: series would be 7.2 V, too high for the 3.3 V regulator and the RFM95. One LM66100 ideal diode per cell stops one cell charging the other; F1 limits a short; P1 is keyed so it can't go in backwards.",
 4: "The cell must stay ≥ 3.35 V during a 100 mA transmit burst (AP2112K dropout ≈ 250 mV, estimated).",
 5: "Q1 and Q2 are high-side P-FETs: <b>gate LOW = sensor ON</b>. The 100 kΩ pull-ups keep sensors off through boot and reset; firmware latches the gate HIGH before making it an output and re-asserts OFF on every wake (SCO-186).",
 6: "<b>Turbidity polarity:</b> a higher ADC count means <b>clearer</b> water. The front end must stay non-inverting; analytics flag downward excursions. Bench check: add milk, the count must fall.",
 7: "The Grove board runs at 3.3 V and its SIG goes straight to A1, no divider. The buoy logs raw counts; NTU is computed downstream only once a calibration curve exists (SCO-12).",
 8: "<b>Open conflict:</b> Rev B draws the turbidity board inside the electronics housing; the Sensor Pod Packing Budget puts it in the pod's dry chamber. Decide before the gland count is fixed.",
 9: "DS18B20 data is on <b>D12</b> with R1 4.7 kΩ to 3V3. The Rev A KiCad schematic still says D5 (gap G3); wire from this set.",
 10: "Shared SPI: SD (CS D10) and radio (CS D8), only one LOW at a time. Shared I²C: PCF8523 0x68 and SHT40 0x44, pull-ups already on the boards. If SD and radio work alone but not together, suspect chip select first.",
 11: "Standby wake comes from the SAMD21's own RTC (32.768 kHz crystal). The PCF8523 is the battery-backed wall clock, re-read after every wake, so drift never accumulates. PCF8523 INT1 is not wired and D5 is free (SCO-196).",
 12: "<b>Never power the RFM95 without an antenna.</b> Deployed antenna ≤ 2.15 dBi and conducted power ≤ 11.6 dBm (FCC ID 2ASEORFM95C, DTS); firmware uses +11 dBm. The housing is engraved “Contains FCC ID: 2ASEORFM95C”.",
 13: "Modem: 915.0 MHz · BW 500 kHz · SF12 · CR 4/8 · explicit header · CRC on. Registers 0x1D = 0x98, 0x1E = 0xC4, 0x26 = 0x04 are computed from the SX1276 map, not bench-verified (SCO-98); fallback SF11 is 0x1E = 0xB4. BW 500 kHz is what 47 CFR §15.247(a)(2) requires.",
 14: "The shore receiver must match those three bytes exactly and apply the SX1276 500 kHz erratum: reg 0x36 ← 0x02, reg 0x3A ← 0x64 (receive side only).",
 15: "Packet: 30 bytes (28-byte body + CRC-16/CCITT-FALSE), little-endian, plus RadioHead's 4-byte header on air; ≈ 559 ms airtime. Firmware and shore decoder are checked against each other in CI (scripts/check_packet_contract.py). Change both and bump SCOUT_PACKET_VERSION.",
 16: "Delivery is blind repetition, never acknowledged: NORMAL 3 copies (gaps 2 s, then 4 s), CONSERVE 1 copy in slot 0 only, CRITICAL none. Shore deduplicates on (buoy_id, record_seq). A missed slot is skipped, not retried; the SD card holds the complete record.",
 17: "The power budget counts 3 transmissions a day with the MCU awake only while sending; firmware sends 3 slots × 3 copies = 9 and stays awake ≈ 7.7 s per slot. That is ≈ 0.07 mAh per slot, ≈ 0.21 mAh/day against the 0.05 budgeted: +≈ 0.16 mAh/day, about 1% of the budget. Re-run the budget with Stage 2 measurements.",
 18: "Sleep floor ≈ 501 µA (estimate: 300 µA board + ≈ 200 µA SD idle + 1 µA RTC) is ≈ 90% of the 13.3 mAh/day budget. Measure it first (SCO-23) and record it in facts.md.",
 19: "Battery life: 2 × 17 Ah × 70% derating = 23.8 Ah usable. Sensors only (13.3 mAh/day) ≈ 4.9 yr; with hydrophone, best estimate (30.3 mAh/day) ≈ 2.1 yr; pessimistic (55.1 mAh/day) ≈ 14 months. Design target 12 months.",
 20: "Li-SOCl₂ discharge is flat, so the 3200 / 3100 mV mode thresholds are provisional and voltage is a poor fuel gauge (SCO-83). On USB, A7 reads the charger output, not a cell.",
 21: "Watchdog 16.384 s (SAMD21 maximum): off during standby, re-armed every wake, petted between transmit copies. record_seq lives in .noinit RAM (magic 0x5C002702), so it survives a watchdog reset but not a full power loss.",
 22: "<b>Set the clock before every deployment.</b> For ≈ 8 s after a reset, with USB connected, the firmware accepts T&lt;unix-epoch&gt; and writes the PCF8523; firmware/tools/set_rtc.py sends it (gap G1, fixed in code by PR #186, SCO-201). Confirm on hardware that RTC_LOST clears. An unset clock gives wrong timestamps <b>and fires the TX slots at the wrong times</b>.",
 23: "SD layout (gap G4, fixed in code, SCO-202): /DATA/YYYYMMDD.CSV and /AUDIO/YYYYMMDD/HHMMSSZ.WAV, FAT 8.3 names in upper case, no buoy_id in the name (it is in every row). The card importer matches .csv in any case; shore-side files keep &lt;buoy_id&gt;_&lt;YYYYMMDD&gt;.csv. Confirm with a real card.",
 24: "<b>Shore design agreed 2026-10-19 (gap G2):</b> the ESP32-S3 + LoRa FeatherWing <i>is</i> the shore station. It runs FreeRTOS, receives, validates and deduplicates, pushes to the dashboard over WiFi, and later sends OTA and settings. <b>Open:</b> which dashboard back end receives the push; today's GitHub Pages site has no endpoint, and Catherine's React + SQL dashboard is to be reviewed first (SCO-120). S3 firmware not written (SCO-24, due 2026-10-30).",
 25: "Audio is never sent over LoRa. Clips stay in /AUDIO/ on the SD card and are retrieved physically (≈ 35 MB/day at 22.05 kHz). Capture code is not written yet (gap G7).",
 26: "Hydrophone bias: AUD_3V3 → R9 100 Ω / C10 → R4 1.1 kΩ → tip ≈ 2.46 V at 0.7 mA (minimum 2 V). Preamp gain ≈ 231 (47 dB) turns ≈ 2.5 mV of reef sound into ≈ 0.6 V at A2, centred on 1.65 V; low-pass ≈ 10.6 kHz anti-alias. If it clips, change R10 to 10 kΩ.",
 27: "Over-the-air updates (ADR-0008, accepted 2026-10-16, not designed yet): listen window after each send (RX ≈ 10–12 mA, not in the budget), image chunks staged on SD with per-chunk ACK and resume, authenticated image, rollback if the new image fails to check in, shore TX within the grant. A ≈ 66.6 KB image is ≈ 270 frames ≈ 13 min on air.",
 28: "SHT40 internal humidity is the leak detector: near-zero RH in a sealed bay, so a rise means a leak. It is on the BOM; firmware and schema columns are not added yet (needs a schema_version bump).",
 29: "Electronics housing: 4.4 in ID × 5 in (111.8 × 127 mm), flange style, static face seal on an AS568-247 O-ring (ID 117.07 × CS 3.53 mm) with every fastener outside the ring. Confirm the ring against a supplier table (SCO-137). Never seal an unverified board (Stage 8).",
 30: "All cables enter through glands in the top cap: hydrophone, antenna, DS18B20, turbidity. L3 has 4 × Ø9 mm cable holes. Glands come from lab stock; gland positions in the cap are not drawn yet. The 3.5 mm plug (≈ 6 mm) must pass its gland or be fitted after it.",
 31: "Packaging option C (2026-10-15): Ø104 mm printed discs on 3 pillars Ø7 at R47.5 (90°/210°/330°) with Ø3 pins or M3 rod. Three layers use 93 of 127 mm, leaving ≈ 34 mm for cable bend. Stack height ≈ 30 mm is unverified, and whether the lid uses part of the 127 mm is not recorded.",
 32: "The D cells lie on their side in L1 (Ø33.4 × 61.6 mm, ≈ 90–100 g each), vents facing away from the electronics.",
 33: "Float v9 (2026-10-16): printed PETG, 992 g, no foam, no ballast stem, no lead, with a cable guide channel through the float. At 2.87 kg: draft 2.56 in, freeboard 3.94 in, GM 1.47 in; self-rights from every angle, but GZ is only ≈ 1 mm near 178°. Tilt test from 180° pending (SCO-171).",
 34: "Stability masses are estimates (battery 250 g, epoxy/coating 330 g, mooring hardware 220 g, pod 217 g, hydrophone 150 g). Replace them with weighed values and re-run run_printed_float.py.",
 35: "Sensor pod hangs ≈ 4 in below the keel (study value). The dry chamber holds electronics; the flood chamber shades the probe from light. Pod O-ring: Everbilt 2-5/8 in OD × 3/16 in CS. Turbidity leads are epoxy-potted, not O-ring sealed.",
 36: "Mooring: tether to an existing authorized structure (permitting path B), no anchor of our own. Line: 3/8 in 3-strand nylon, scope TBD (SCO-17). Attachment hardware on the printed float is undecided. Fallback at an unmarked site: one mushroom anchor beside, never on, coral.",
 37: "Corrosion: 316 stainless hardware with 3M 5200 over exposed bolt heads and joints. Antifouling: Sea Hawk Smart Solution (copper-free; copper is toxic to coral). Fouling drift is screened in analytics (drift.py).",
 38: "Deployment depth 2–8 m. Pressure-test the sealed housing to 5 m water-equivalent before deployment. Survival design set: d 2 m · H 1.2 m · T 6 s · current 0.8 m/s · wind 22 m/s.",
 39: "Handling: set the buoy down on its base, never on a sidewall.",
 40: "Analytics: QC (completeness, gross range, QARTOD flat-line and rate-of-change) → daily means with a coverage floor → NOAA CRW Degree Heating Weeks (MMM + 1 °C, 12 weeks) → Mann-Kendall (Hamed–Rao) + Sen slope → turbidity anomalies (modified z-score) → biofouling drift. Each buoy is analysed alone, with its own MMM.",
 41: "The dashboard publishes from shore/data-live/, never shore/data/. Simulated data carries a banner. GitHub Pages rebuilds on push to main and hourly.",
 42: "Acoustic pipeline (retrieved SD cards): ACI, BI, NDSI, H, ADI → PCA → Acoustic Quality Score, on a 64-bit host (Pi OS aarch64 or a laptop).",
