; SCOUT buoy firmware — Adafruit Feather M0 + RFM95 (SAMD21), per ADR-0001.
;
;   pio run              # build for the Feather M0
;   pio run -t upload    # flash (double-tap reset for the bootloader)
;   pio test -e native   # run the pure-logic unit tests on the host (packet, scheduler)

[platformio]
default_envs = feather_m0

[env:feather_m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    adafruit/RTClib@^2.1.4
    mikem/RadioHead@^1.120
    arduino-libraries/SD@^1.2.4
    ; Registry ID carries spaces; "arduino-libraries/ArduinoLowPower" does not resolve.
    arduino-libraries/Arduino Low Power@^1.2.2
    adafruit/Adafruit SleepyDog Library@^1.6.5

; Host build for the hardware-free libraries (lib/scout_packet, lib/scout_scheduler).
; test_build_src stays off (default), so src/ drivers and main.cpp are excluded here.
[env:native]
platform = native
build_flags = -std=c++11 -Wall -Wextra
