; SCOUT buoy firmware — Adafruit Feather M0 + RFM95 (SAMD21), per ADR-0001.
;
;   pio run                          # build the buoy firmware for the Feather M0
;   pio run -t upload                # flash (double-tap reset for the bootloader)
;   pio test -e native               # pure-logic unit tests on the host
;   pio run -e feather_m0_bench -t upload   # BENCH ONLY: sample + transmit every minute
;   pio run -e feather_m0_wdt_test -t upload # BENCH ONLY: hangs once to force a watchdog reset (G6)
;   pio run -e feather_m0_rx -t upload      # second Feather: bench LoRa receiver (SCO-155)
;   pio run -e feather_esp32s3_shore -t upload  # ESP32-S3 shore station receiver (SCO-24)
;   pio run -e feather_m0_downlink -e feather_esp32s3_shore_downlink  # compile check, SCO-198
;   pio run -e scout_boot                    # the OTA boot stub alone; tools/make_boot_image.py embeds it

[platformio]
default_envs = feather_m0

; The shipped buoy build. SCOUT_DOWNLINK is on (remote settings, 2026-11-04) and SCOUT_OTA is on
; (over-the-air firmware, 2026-11-12, SCO-197): it needs the real keys in src/downlink_key.h and
; src/ota_pubkey.h (both gitignored) and refuses to compile without them. With SCOUT_OTA the
; scout_boot stub sits at 0x2000 and the app at 0x8000; the first flash of that layout is over USB.
[env:feather_m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200
build_flags = -Wall -DSCOUT_DOWNLINK -DSCOUT_OTA
build_src_filter = +<*> -<bench_rx/> -<shore_rx/> -<boot/>
lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    adafruit/RTClib@^2.1.4
    mikem/RadioHead@^1.120
    arduino-libraries/SD@^1.2.4
    ; Registry ID carries spaces; "arduino-libraries/ArduinoLowPower" does not resolve.
    arduino-libraries/Arduino Low Power@^1.2.2
    adafruit/Adafruit SleepyDog Library@^1.6.5
    ; Remote settings survive a power loss in emulated EEPROM (src/drivers/settings_store.h).
    cmaglie/FlashStorage@^1.0.0

; Bench build of the buoy firmware: samples every 60 s and transmits after every sample, so the
; link test gets a frame a minute. Prints a warning at boot. Never deploy this build.
; Bench builds never deploy, so they may fall back to the public example downlink key (the
; firmware says so at boot).
[env:feather_m0_bench]
extends = env:feather_m0
build_flags = ${env:feather_m0.build_flags} -DSCOUT_BENCH -DSCOUT_DOWNLINK_ALLOW_EXAMPLE_KEY -DSCOUT_OTA_ALLOW_EXAMPLE_KEY

; Watchdog test build (runbook Stage 5, gate G6): the bench build, plus one deliberate hang on
; the second cycle after any boot the watchdog did not cause, so the watchdog fires once and the
; next boot reports watchdog_reset=yes. Never deploy this build.
[env:feather_m0_wdt_test]
extends = env:feather_m0_bench
build_flags = ${env:feather_m0_bench.build_flags} -DSCOUT_WDT_TEST

; Bench LoRa receiver for a second Feather M0 RFM95 (src/bench_rx/). Uses the buoy's config.h.
[env:feather_m0_rx]
extends = env:feather_m0
build_src_filter = -<*> +<bench_rx/>
lib_deps = mikem/RadioHead@^1.120

; Shore station: ESP32-S3 Feather (5477) + LoRa FeatherWing RFM95W (3231), src/shore_rx/.
; Receive, validate, decode, dedupe, and push to the console over WiFi (SCO-237; needs
; src/shore_rx/shore_secrets.h, else WiFi stays off). Uses the buoy's config.h for the modem.
; The shipped shore station. Transmits settings commands (SCOUT_DOWNLINK) and relays signed
; firmware (SCOUT_OTA, SCO-197), so it also needs src/downlink_key.h with the key of every buoy it
; commands and src/ota_pubkey.h, against which it checks every bundle before relaying it.
[env:feather_esp32s3_shore]
; Pinned to 6.x (Arduino core 2.0.x): RadioHead's RH_ASK.cpp uses the core 2.x timer API and
; fails to compile on core 3.x, and PlatformIO builds every source file in the library.
platform = espressif32@~6.9.0
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
; -ffp-contract=off: lib/scout_console's exact rounding must not have multiply-adds fused.
build_flags = -Wall -ffp-contract=off -DSCOUT_DOWNLINK -DSCOUT_OTA
build_src_filter = -<*> +<shore_rx/>
lib_deps = mikem/RadioHead@^1.120

; COMPILE CHECK ONLY for the settings downlink (SCO-198): the buoy and shore built with
; SCOUT_DOWNLINK and the PUBLIC example keys (both print a warning at boot). Never flash these to
; a deployed unit. A real downlink build needs src/downlink_key.h and Isabella's sign-off.
; Compile checks of the shipped builds with the public example keys, for CI and anyone without
; the real keys. Never deploy these.
[env:feather_m0_downlink]
extends = env:feather_m0
build_flags = ${env:feather_m0.build_flags} -DSCOUT_DOWNLINK_ALLOW_EXAMPLE_KEY -DSCOUT_OTA_ALLOW_EXAMPLE_KEY

[env:feather_esp32s3_shore_downlink]
extends = env:feather_esp32s3_shore
build_flags = ${env:feather_esp32s3_shore.build_flags} -DSCOUT_DOWNLINK_ALLOW_EXAMPLE_KEY -DSCOUT_OTA_ALLOW_EXAMPLE_KEY

; COMPILE CHECK ONLY for the WiFi push (SCO-237): dummy WiFi and token values, so CI links the
; network task, which a build without src/shore_rx/shore_secrets.h drops. Never flash it.
[env:feather_esp32s3_shore_link_check]
extends = env:feather_esp32s3_shore
build_flags = ${env:feather_esp32s3_shore.build_flags} -DSHORE_NET_LINK_CHECK -DSCOUT_DOWNLINK_ALLOW_EXAMPLE_KEY -DSCOUT_OTA_ALLOW_EXAMPLE_KEY

; The scout_boot stub itself (src/boot/), linked at 0x2000 and at most 24 KB. Not flashed on its
; own: tools/make_boot_image.py turns it into src/ota/scout_boot_image.h for the OTA builds.
[env:scout_boot]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
build_flags = -Wall -Os
build_src_filter = -<*> +<boot/>
lib_deps =
    arduino-libraries/SD@^1.2.4
    cmaglie/FlashStorage@^1.0.0

; Host build for the hardware-free libraries (lib/scout_packet, lib/scout_scheduler, ...).
; test_build_src stays off (default), so src/ drivers and main.cpp are excluded here.
[env:native]
platform = native
build_flags = -std=c++11 -Wall -Wextra -ffp-contract=off
